<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Key Codes</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Personajes</h1>
    <canvas id="canvas" width="1000" height="800"></canvas>
    <aside>Presiona X, M, L, F, N o H para cambiar de personaje.</aside>
    <script src="keycodes.js"></script>
    
    <script>
    window.onload = function () {
        var canvas = document.getElementById("canvas");
        var context = canvas.getContext("2d");

        // Tamaño de la imagen
        var ancho = 400;
        var alto = 400;

        // Posición de la imagen
        var x = (canvas.width - ancho) / 2;
        var y = 180;

        // Imágenes de los personajes
        var xiyangyang = new Image();
        xiyangyang.src = "xi-imagen.jpg";

        var meiyangyang = new Image();
        meiyangyang.src = "mei-imagen.jpg";

        var lanyangyang = new Image();
        lanyangyang.src = "lan-imagen.jpg";

        var feiyangyang = new Image();
        feiyangyang.src = "fei-imagen.jpg";

        var nuanyangyang = new Image();
        nuanyangyang.src = "nuan-imagen.jpg";

        var huitailang = new Image();
        huitailang.src = "hui-imagen.jpg";

    // Función para mostrar el personaje
    function mostrarPersonaje(nombre, descripcion, imagen) {
        context.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        // Nombre del personaje
        context.font = "40px Verdana";
        context.fillStyle = "#7b68b5";
        context.textAlign = "center";
        context.fillText(
            nombre,
            canvas.width / 2,
            100
        );

        // Imagen
        context.drawImage(
            imagen,
            x,
            y,
            ancho,
            alto
        );

        // Descripción
        context.font = "18px Verdana";
        context.fillStyle = "#191b38";
        context.textAlign = "center";

        context.fillText(
            descripcion,
            canvas.width / 2,
            y + alto + 50
        );
    }

      function onKeyboardEvent (event) {
        switch (event.keyCode) {
        case keycode.UP:
          console.log("up!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          y-=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.DOWN:
          console.log("down!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          y+=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.LEFT:
          console.log("left!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          x-=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.RIGHT:
          console.log("right!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          x+=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.SPACE:
          console.log("Jump!");
          break;

        case keycode.X:
            console.log("Letra X");
            mostrarPersonaje(
            "Weslie (喜羊羊)",
            "Un personaje inteligente y valiente.",
            xiyangyang);
            break;
        
        case keycode.M:
            console.log("Letra M");
            mostrarPersonaje(
            "Tibbie (美羊羊)",
            "Un personaje amable y cariñoso.",
            meiyangyang);
            break;

        case keycode.L:
            console.log("Letra L");
            mostrarPersonaje(
            "Paddi (懒羊羊)",
            "Le gusta dormir y comer.",
            lanyangyang);
            break;

        case keycode.F:
            console.log("Letra F");
            mostrarPersonaje(
            "Sparky (沸羊羊)",
            "Un personaje fuerte y deportista.",
            feiyangyang);
            break;

        case keycode.N:
            console.log("Letra N");
            mostrarPersonaje(
            "Jonie (暖羊羊)",
            "Un personaje amable y responsable.",
            nuanyangyang);
            break;

        case keycode.H:
            console.log("Letra H");
            mostrarPersonaje(
            "Wolffy (灰太狼)",
            "Un personaje inteligente y divertido.",
            huitailang);
            break;
            
        default:
            console.log(event.keyCode);
        }
      }

      window.addEventListener('keydown', onKeyboardEvent, false);
    };
    </script>
        <p>
        <a href="../index.html">Regresar al menú</a>
    </p>
  </body>
</html>
