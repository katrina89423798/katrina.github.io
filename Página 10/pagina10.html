    // =================================================
    // FUNCIÓN GENERAL PARA LIMPIAR UN CANVAS

    function limpiarCanvas(id) {

        var canvas =
            document.getElementById(id);

        var context =
            canvas.getContext("2d");

        context.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    // =================================================

    function dibujarCasita() {

        var canvas =
            document.getElementById("canvasCasita");

        var context =
            canvas.getContext("2d");

        limpiarCanvas("canvasCasita");


        // Fondo pastel

        var gradienteFondo = context.createLinearGradient(
            0, 0,
            0, canvas.height
        );

        gradienteFondo.addColorStop(0, "#FFF8F0");
        gradienteFondo.addColorStop(1, "#E2F4EC");

        context.fillStyle = gradienteFondo;

        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Sol

        context.beginPath();

        context.arc(
            120,
            100,
            45,
            0,
            Math.PI * 2

        var gradienteSol = context.createLinearGradient(
            120, 55,
            120, 145

        gradienteSol.addColorStop(0, "#FFF1A8");
        gradienteSol.addColorStop(1, "#FFD1A4");

        context.fillStyle = gradienteSol;

        context.fill();

        context.strokeStyle = "#927B70";

        context.lineWidth = 3;

        context.stroke();


        // Casa

        context.beginPath();

        context.rect(
            250,
            230,
            300,
            180

        var gradienteCasa = context.createLinearGradient(
            0, 0,    // arriba

        gradienteCasa.addColorStop(0.3, "#FFE5B4");
        gradienteCasa.addColorStop(1, "#E8A6A0");

        context.fillStyle = gradienteCasa;
        context.fill();

        context.strokeStyle = "#927B70";

        context.lineWidth = 5;

        context.stroke();


        // Techo

        context.beginPath();

        context.moveTo(
            210,
            230
        );

        context.lineTo(
            400,
            80
        );

        context.lineTo(
            590,
            230
        );

        context.closePath();

        var gradienteTecho = context.createLinearGradient(

        gradienteTecho.addColorStop(0, "#F3B6B0");

    // =================================================
    // 3. ESTRELLA
    // =================================================

    function dibujarEstrella() {

        var canvas =
            document.getElementById("canvasEstrella");

        var context =
            canvas.getContext("2d");

        limpiarCanvas("canvasEstrella");


        // Fondo pastel

        var gradienteFondo = context.createLinearGradient(
            0, 0,
            0, canvas.height
        );

        gradienteFondo.addColorStop(0, "#E1EDF7");
        gradienteFondo.addColorStop(1, "#E8DFF5");

        context.fillStyle = gradienteFondo;

        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        var centroX = 400;

        var centroY = 250;

        var radioExterior = 180;

        var radioInterior = 75;

        var puntos = 10;


        context.beginPath();


        for (
            var i = 0;
            i < puntos;
            i++
        ) {

            var angulo =
                -Math.PI / 2 +
                i * Math.PI / 5;

            var radio =
                i % 2 === 0
                    ? radioExterior
                    : radioInterior;

            var x =
                centroX +
                Math.cos(angulo) * radio;

            var y =
                centroY +
                Math.sin(angulo) * radio;


            if (i === 0) {

                context.moveTo(
                    x,
                    y
                );

            } else {

                context.lineTo(
                    x,
                    y
                );

            }

        }


        context.closePath();

        var gradienteEstrella =
            context.createLinearGradient(
                0, 70,
                0, 430
            );

        gradienteEstrella.addColorStop(
            0,
            "#FFF7B2"
        );

        gradienteEstrella.addColorStop(
            1,
            "#E8A6A0"
        );


        context.fillStyle = gradienteEstrella;

        context.fill();

        context.strokeStyle = "#927B70";

        context.lineWidth = 6;

        context.stroke();

    }

    // =================================================
    // FUNCIÓN PARA DIBUJAR POLÍGONOS
    // =================================================

    function poligono(
        context,
        puntos,
        relleno,
        borde,
        grosor
    ) {

        context.beginPath();

        context.moveTo(
            puntos[0][0],
            puntos[0][1]
        );


        for (
            var i = 1;
            i < puntos.length;
            i++
        ) {

            context.lineTo(
                puntos[i][0],
                puntos[i][1]
            );

        }


        context.closePath();

        context.fillStyle = relleno;

        context.fill();

        context.strokeStyle =
            borde || "#927B70";

        context.lineWidth =
            grosor || 3;

        context.stroke();

    }


    // =================================================
    // FUNCIÓN PARA DIBUJAR LÍNEAS
    // =================================================

    function linea(
        context,
        x1,
        y1,
        x2,
        y2
    ) {

        context.beginPath();

        context.moveTo(
            x1,
            y1
        );

        context.lineTo(
            x2,
            y2
        );

        context.strokeStyle = "#927B70";

        context.lineWidth = 4;

        context.stroke();

    }

    // Estrellas
    function estrella(x, y, radio, color) {
        contextZorro.beginPath();

        for (let i = 0; i < 10; i++) {
            const angulo = -Math.PI / 2 + i * Math.PI / 5;
            const r = i % 2 === 0 ? radio : radio * 0.45;

            const px = x + Math.cos(angulo) * r;
            const py = y + Math.sin(angulo) * r;

            if (i === 0) {
                contextZorro.moveTo(px, py);
            } else {
                contextZorro.lineTo(px, py);
            }
        }

        contextZorro.closePath();
        contextZorro.fillStyle = color;
        contextZorro.fill();
        contextZorro.strokeStyle = oscuro;
        contextZorro.lineWidth = 2;
        contextZorro.stroke();
    }

        contextZorro.lineTo(x + tamano, y);

        contextZorro.lineTo(x, y + tamano);
        contextZorro.lineTo(x - tamano * 0.25, y + tamano * 0.25);
        contextZorro.lineTo(x - tamano, y);
        contextZorro.lineTo(x - tamano * 0.25, y - tamano * 0.25);
        contextZorro.closePath();

        contextZorro.fillStyle = "#FFF1C7";
        contextZorro.fill();
        contextZorro.strokeStyle = oscuro;
        contextZorro.lineWidth = 1.5;
